<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Input</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div class="max-w-2xl mx-auto p-4">
    <h1 class="text-xl font-bold mb-4">Voice Input</h1>

    <!-- タブ -->
    <div class="flex gap-2 mb-4">
      <button id="tab-main" onclick="switchTab('main')"
        class="px-4 py-2 rounded bg-blue-600 text-white font-medium">メイン</button>
      <button id="tab-history" onclick="switchTab('history')"
        class="px-4 py-2 rounded bg-gray-700 text-gray-300 font-medium">履歴</button>
      <button id="tab-settings" onclick="switchTab('settings')"
        class="px-4 py-2 rounded bg-gray-700 text-gray-300 font-medium">設定</button>
    </div>

    <!-- ステータスバー -->
    <div class="flex items-center justify-between bg-gray-800 rounded p-3 mb-4">
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <span class="text-sm">録音:</span>
          <span id="rec-indicator" class="inline-block w-3 h-3 rounded-full bg-gray-500"></span>
          <span id="rec-label" class="text-sm text-gray-400">停止中</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-sm">校正:</span>
          <button id="proofread-toggle" onclick="toggleProofread()"
            class="px-2 py-0.5 rounded text-xs font-medium bg-green-600 text-white">ON</button>
        </div>
      </div>
      <div class="flex items-center gap-6">
        <button id="btn-copy-main" onclick="copyMainText()"
          class="px-2 py-1 rounded bg-gray-700 hover:bg-blue-700 text-gray-300 hover:text-white text-sm transition-colors"
          title="クリップボードにコピー">&#x1F4CB;</button>
        <button id="btn-shutdown" onclick="shutdownServer()"
          class="px-2 py-1 rounded bg-gray-700 hover:bg-red-700 text-gray-300 hover:text-white text-sm transition-colors"
          title="サーバーを停止">&#x23FB;</button>
      </div>
    </div>

    <!-- メインタブ: セッション表示 -->
    <div id="panel-main">
      <div id="editor-mode">
        <textarea id="editor-textarea"
          class="w-full bg-gray-800 text-gray-100 font-mono text-sm p-3 rounded-t border border-gray-700 focus:outline-none focus:border-blue-500 resize-y"
          rows="8" placeholder="待機中..."></textarea>
        <div id="editor-interim"
          class="bg-gray-800 border border-t-0 border-gray-700 rounded-b p-3 min-h-[2rem] font-mono text-sm text-gray-400">
        </div>
      </div>
    </div>

    <!-- 履歴タブ -->
    <div id="panel-history" class="hidden">
      <div id="history-list" class="space-y-3">
        <p class="text-gray-500">読み込み中...</p>
      </div>
    </div>

    <!-- 設定タブ -->
    <div id="panel-settings" class="hidden">
      <!-- 入力欄は SETTINGS_FIELDS からJSで生成する (項目定義の二重管理を避ける) -->
      <div id="settings-form" class="space-y-3">
        <p class="text-gray-500">読み込み中...</p>
      </div>
      <div class="flex items-center gap-3 mt-4">
        <button id="btn-save-settings" onclick="saveSettings()"
          class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-medium transition-colors">保存</button>
        <p id="settings-status" class="text-sm"></p>
      </div>
    </div>
  </div>

  <div id="copy-toast"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2 rounded bg-gray-700 text-white text-sm shadow-lg opacity-0 pointer-events-none transition-opacity duration-200">
    コピーしました
  </div>

<script>
// タブ名 -> 表示時に走らせる読み込み処理 (なければ null)。
// タブが増えても if/else の分岐を足さずに済むよう、一覧で持つ。
const TABS = { main: null, history: () => loadHistory(), settings: () => loadSettings() };

function switchTab(tab) {
  const activeClass = 'px-4 py-2 rounded bg-blue-600 text-white font-medium';
  const inactiveClass = 'px-4 py-2 rounded bg-gray-700 text-gray-300 font-medium';
  for (const name of Object.keys(TABS)) {
    const isActive = name === tab;
    document.getElementById(`tab-${name}`).className = isActive ? activeClass : inactiveClass;
    document.getElementById(`panel-${name}`).classList.toggle('hidden', !isActive);
  }
  TABS[tab]?.();
}

function updateRecordingUI(recording) {
  const indicator = document.getElementById('rec-indicator');
  const label = document.getElementById('rec-label');
  const shutdownBtn = document.getElementById('btn-shutdown');
  if (recording) {
    indicator.className = 'inline-block w-3 h-3 rounded-full bg-red-500 animate-pulse';
    label.textContent = '録音中';
    label.className = 'text-sm text-red-400';
    shutdownBtn.disabled = true;
    shutdownBtn.className = 'px-2 py-1 rounded bg-gray-700 text-gray-500 text-sm opacity-50 cursor-not-allowed';
  } else {
    indicator.className = 'inline-block w-3 h-3 rounded-full bg-gray-500';
    label.textContent = '停止中';
    label.className = 'text-sm text-gray-400';
    shutdownBtn.disabled = false;
    shutdownBtn.className = 'px-2 py-1 rounded bg-gray-700 hover:bg-red-700 text-gray-300 hover:text-white text-sm transition-colors';
  }
}

let copyToastTimeoutId = null;

function showCopyToast() {
  const toast = document.getElementById('copy-toast');
  toast.classList.remove('opacity-0');
  clearTimeout(copyToastTimeoutId);
  copyToastTimeoutId = setTimeout(() => {
    toast.classList.add('opacity-0');
  }, 1500);
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    showCopyToast();
  } catch {
    // クリップボードアクセス不可時は何もしない
  }
}

function copyMainText() {
  const text = document.getElementById('editor-textarea').value;
  copyToClipboard(text);
}

async function shutdownServer() {
  if (!confirm('サーバーを停止しますか？')) return;
  const btn = document.getElementById('btn-shutdown');
  btn.disabled = true;
  btn.textContent = '停止中...';
  btn.className = 'px-2 py-1 rounded bg-red-700 text-white text-sm cursor-not-allowed';
  serverShuttingDown = true;
  try {
    await fetch('/api/shutdown', { method: 'POST' });
  } catch {
    // サーバーが既に停止している場合
  }
}

// --- SSE ---
let serverShuttingDown = false;

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function escapeAttr(text) {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function appendToTextarea(text) {
  const textarea = document.getElementById('editor-textarea');
  const startPos = textarea.selectionStart;
  const endPos = textarea.selectionEnd;
  const currentLen = textarea.value.length;
  textarea.value += text;
  // カーソルが末尾にあった場合は末尾に追従、そうでなければ元の位置を保持
  if (startPos === currentLen) {
    textarea.selectionStart = textarea.value.length;
    textarea.selectionEnd = textarea.value.length;
  } else {
    textarea.selectionStart = startPos;
    textarea.selectionEnd = endPos;
  }
}

function updateEditorInterim(text) {
  const interim = document.getElementById('editor-interim');
  if (text) {
    interim.innerHTML = `${escapeHtml(text)} <span class="text-xs">[認識中]</span>`;
  } else {
    interim.innerHTML = '';
  }
}

// --- セッションごとの表示キュー ---
// 各要素: { id: string, text: string, ended: boolean }
// 先頭 (sessionQueue[0]) のセッションのみtextarea/interimに表示し、
// 完了順に1件ずつ自動確定 (校正→finalize-session) する。
// これにより異なるセッションの文字起こし結果がtextarea上で混在しない。
// textareaは「表示中セッションが切り替わる (=次の録音が始まる) 瞬間」にのみ
// クリアする。finalize直後にクリアすると、確定直後のテキストが一瞬しか
// 見えずに消えてしまうため、確定後もそのセッションの内容を表示し続ける。
let sessionQueue = [];
let finalizing = false;
let displayedSessionId = null;

function getOrCreateSession(id) {
  let session = sessionQueue.find(s => s.id === id);
  if (!session) {
    session = { id, text: '', ended: false };
    sessionQueue.push(session);
  }
  return session;
}

function ensureDisplaying(session) {
  if (displayedSessionId === session.id) return;
  displayedSessionId = session.id;
  document.getElementById('editor-textarea').value = session.text;
  updateEditorInterim('');
}

async function tryAdvanceQueue() {
  if (finalizing || sessionQueue.length === 0) return;
  const front = sessionQueue[0];
  ensureDisplaying(front);

  if (!front.ended) return;

  finalizing = true;
  const textarea = document.getElementById('editor-textarea');
  if (isProofreadEnabled() && front.text.trim()) {
    updateEditorInterim('校正中...');
    try {
      const res = await fetch('/api/proofread', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: front.text }),
      });
      const data = await res.json();
      textarea.value = data.text;
      front.text = data.text;
    } catch {
      // 校正失敗時は元テキストのまま
    }
    updateEditorInterim('');
  }

  await fetch('/api/finalize-session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: front.id, text: textarea.value }),
  });

  sessionQueue.shift();
  finalizing = false;
  tryAdvanceQueue(); // 次のセッションが既にended済みなら連続処理
}

function connectSSE() {
  const evtSource = new EventSource('/events');

  evtSource.addEventListener('interim', (e) => {
    const data = JSON.parse(e.data);
    if (sessionQueue.length > 0 && sessionQueue[0].id === data.session_id) {
      updateEditorInterim(data.text);
    }
  });

  evtSource.addEventListener('recognized', (e) => {
    const data = JSON.parse(e.data);
    const session = getOrCreateSession(data.session_id);
    session.text += data.text;
    if (sessionQueue[0].id === session.id) {
      appendToTextarea(data.text);
      updateEditorInterim('');
    }
  });

  evtSource.addEventListener('processing', (e) => {
    const data = JSON.parse(e.data);
    if (sessionQueue.length > 0 && sessionQueue[0].id === data.session_id) {
      updateEditorInterim(data.message || '文字起こし中...');
    }
  });

  evtSource.addEventListener('processing_done', (e) => {
    const data = JSON.parse(e.data);
    if (sessionQueue.length > 0 && sessionQueue[0].id === data.session_id) {
      updateEditorInterim('');
    }
  });

  evtSource.addEventListener('status', (e) => {
    const data = JSON.parse(e.data);
    updateRecordingUI(data.recording);
    if (data.recording) {
      getOrCreateSession(data.session_id);
      tryAdvanceQueue(); // 新セッションがキュー先頭なら、直ちに表示を切り替える
    }
  });

  evtSource.addEventListener('session_end', (e) => {
    const data = JSON.parse(e.data);
    const session = getOrCreateSession(data.session_id);
    session.ended = true;
    tryAdvanceQueue();
  });

  evtSource.addEventListener('error', (e) => {
    const data = JSON.parse(e.data);
    const container = document.getElementById('editor-mode');
    const errorDiv = document.createElement('p');
    errorDiv.className = 'text-red-400 text-sm';
    errorDiv.textContent = data.message;
    container.appendChild(errorDiv);
  });

  evtSource.addEventListener('shutdown', () => {
    serverShuttingDown = true;
    evtSource.close();
    document.body.innerHTML = '<div class="flex items-center justify-center min-h-screen bg-gray-900"><p class="text-gray-400 text-lg">サーバーが停止しました</p></div>';
  });

  evtSource.onerror = () => {
    evtSource.close();
    if (!serverShuttingDown) {
      setTimeout(connectSSE, 3000);
    }
  };
}

async function loadHistory() {
  const container = document.getElementById('history-list');
  try {
    const res = await fetch('/api/history');
    const sessions = await res.json();
    if (sessions.length === 0) {
      container.innerHTML = '<p class="text-gray-500">履歴はありません</p>';
      return;
    }
    container.innerHTML = sessions.map(s => {
      const dt = new Date(s.started_at).toLocaleString('ja-JP');
      return `<div class="bg-gray-800 rounded p-3 cursor-pointer hover:bg-gray-700 transition-colors"
        onclick="copyHistoryCard(this)" data-text="${escapeAttr(s.text)}" title="クリックしてコピー">
        <div class="flex justify-between items-start">
          <div class="text-xs text-gray-400 mb-1">${escapeHtml(dt)}</div>
          <button onclick="deleteHistory(event, '${escapeHtml(s.id)}')"
            class="text-gray-500 hover:text-red-400 text-xs ml-2 shrink-0">削除</button>
        </div>
        <div class="text-sm">${escapeHtml(s.text)}</div>
      </div>`;
    }).join('');
  } catch {
    container.innerHTML = '<p class="text-gray-500">履歴の読み込みに失敗しました</p>';
  }
}

function copyHistoryCard(cardEl) {
  copyToClipboard(cardEl.dataset.text);
  const original = cardEl.className;
  cardEl.className = original.replace('bg-gray-800', 'bg-blue-900');
  setTimeout(() => { cardEl.className = original; }, 300);
}

async function deleteHistory(event, sessionId) {
  event.stopPropagation();
  try {
    const res = await fetch(`/api/history/${sessionId}`, { method: 'DELETE' });
    if (res.ok) {
      loadHistory();
    }
  } catch {
    // ネットワークエラー時は何もしない
  }
}

// --- 設定タブ ---
// key は DynamicSettings のフィールド名と一致させる。
// step があれば type="number" (小数は step で刻みを指定)、なければ type="text"。
const SETTINGS_FIELDS = [
  { key: 'max_session_duration_sec', label: '最大セッション時間', unit: '秒', step: '1' },
  { key: 'silence_timeout_sec', label: '無音セッション終了', unit: '秒', step: '1' },
  { key: 'segment_silence_sec', label: '無音区切り (逐次文字起こし)', unit: '秒', step: '0.5' },
  { key: 'vad_threshold', label: '発話判定の閾値', unit: '0〜1', step: '0.05' },
  { key: 'mai_locale', label: '認識ロケール', unit: '' },
  { key: 'mai_model_name', label: '認識モデル', unit: '' },
  { key: 'mai_timeout_sec', label: '認識タイムアウト', unit: '秒', step: '1' },
  { key: 'proofread_timeout_sec', label: '校正タイムアウト', unit: '秒', step: '1' },
  { key: 'shutdown_delay_sec', label: '終了までの遅延', unit: '秒', step: '0.1' },
  { key: 'sse_keepalive_sec', label: 'SSEキープアライブ間隔', unit: '秒', step: '1' },
];

// GET のレスポンス全体。PUT は全項目差し替えなので、フォームに出していない
// 項目 (将来サーバー側だけに追加されたもの) を暗黙にリセットしないよう、
// 元の値を保持してフォーム入力だけを上書きして送る。
let loadedSettings = null;

function setSettingsStatus(message, isError) {
  const status = document.getElementById('settings-status');
  status.textContent = message;
  status.className = `text-sm ${isError ? 'text-red-400' : 'text-green-400'}`;
}

async function loadSettings() {
  const container = document.getElementById('settings-form');
  setSettingsStatus('', false);
  try {
    const res = await fetch('/api/settings');
    loadedSettings = await res.json();
  } catch {
    container.innerHTML = '<p class="text-gray-500">設定の読み込みに失敗しました</p>';
    return;
  }
  container.innerHTML = SETTINGS_FIELDS.map(f => `
    <div class="flex items-center justify-between bg-gray-800 rounded p-3">
      <label for="setting-${f.key}" class="text-sm">${escapeHtml(f.label)}</label>
      <div class="flex items-center gap-2">
        <input id="setting-${f.key}" data-key="${f.key}"
          type="${f.step ? 'number' : 'text'}"${f.step ? ` step="${f.step}"` : ''}
          value="${escapeAttr(loadedSettings[f.key])}"
          class="w-40 bg-gray-900 text-gray-100 text-sm px-2 py-1 rounded border border-gray-700 focus:outline-none focus:border-blue-500">
        <span class="text-xs text-gray-400 w-10">${escapeHtml(f.unit)}</span>
      </div>
    </div>`).join('');
}

function collectSettings() {
  const body = { ...loadedSettings };
  for (const field of SETTINGS_FIELDS) {
    const value = document.getElementById(`setting-${field.key}`).value;
    body[field.key] = field.step ? Number(value) : value;
  }
  return body;
}

function formatSettingsError(detail) {
  if (!Array.isArray(detail)) return '保存に失敗しました';
  // FastAPI の 422 は [{loc: [...], msg: "..."}] 形式。loc の末尾が
  // フィールド名だが、model_validator 違反ではボディ全体を指すため
  // 末尾が 'body' になる。その場合はメッセージのみ表示する。
  return detail.map(e => {
    const field = e.loc?.[e.loc.length - 1];
    return field && field !== 'body' ? `${field}: ${e.msg}` : e.msg;
  }).join(' / ');
}

async function saveSettings() {
  const btn = document.getElementById('btn-save-settings');
  btn.disabled = true;
  setSettingsStatus('保存中...', false);
  try {
    const res = await fetch('/api/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(collectSettings()),
    });
    const data = await res.json();
    if (res.ok) {
      loadedSettings = data;
      setSettingsStatus('保存しました (次回の録音・校正から反映されます)', false);
    } else {
      setSettingsStatus(formatSettingsError(data.detail), true);
    }
  } catch {
    setSettingsStatus('保存に失敗しました', true);
  } finally {
    btn.disabled = false;
  }
}

// --- 校正トグル ---
function isProofreadEnabled() {
  return localStorage.getItem('proofreadEnabled') !== 'false';
}

function toggleProofread() {
  const enabled = !isProofreadEnabled();
  localStorage.setItem('proofreadEnabled', enabled ? 'true' : 'false');
  updateProofreadUI(enabled);
}

function updateProofreadUI(enabled) {
  const btn = document.getElementById('proofread-toggle');
  if (enabled) {
    btn.textContent = 'ON';
    btn.className = 'px-2 py-0.5 rounded text-xs font-medium bg-green-600 text-white';
  } else {
    btn.textContent = 'OFF';
    btn.className = 'px-2 py-0.5 rounded text-xs font-medium bg-gray-600 text-gray-300';
  }
}

// 初期化
updateProofreadUI(isProofreadEnabled());
connectSSE();
</script>
</body>
</html>
